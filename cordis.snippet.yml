# dsh-auto-recover — composition snippet.
#
# This plugin is process-global (it watches every agent's quota errors and
# resumes across sessions), so mount it in the profile/host composition —
# NOT in an agent preset.
#
# Add this to $DSH_HOME/profiles/<name>/cordis.patch.yml
# (or the home-level $DSH_HOME/cordis.patch.yml):
- insert:
    - id: auto-recover
      name: '@maigic/dsh-auto-recover'
